name: RC64 branch validation
on:
  push:
    branches:
      - rc64-durable-transport-recovery
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Transport heartbeat tests
        run: python tests/test_rc60_heartbeat_lifecycle.py
      - name: OpenCode runtime tests
        run: |
          python tests/test_components.py \
            ComponentsTests.test_opencode_plugin_runtime_launch_follow_compatibility_and_wake \
            ComponentsTests.test_opencode_v2_plugin_runtime_transport_recovery \
            ComponentsTests.test_opencode_plugin_uses_stable_follow_tool_and_session_wake_not_background_subagent_protocol
      - name: Syntax checks
        run: |
          python -m py_compile scripts/parent_tick.py
          node --check adapters/tbag-opencode-transport-core.js
          node --check adapters/opencode/tbag.js
          node --check adapters/opencode/tbag-v2.js
          node --check tests/opencode_plugin_runtime.mjs
          node --check tests/opencode_v2_plugin_runtime.mjs
