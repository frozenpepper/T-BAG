name: RC53 ceremony collapse

on:
  push:
    branches: [rc53-ceremony-collapse]
    paths:
      - '.github/rc53_patch.py'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc53-ceremony-collapse
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply architectural fixes
        run: python .github/rc53_patch.py
      - name: Validate
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m py_compile scripts/*.py
          git diff --check
      - name: Commit verified tree
        run: |
          git config user.name 'Orb'
          git config user.email 'taio84@yahoo.it'
          git add scripts/dsd_task.py worker/ANALYST-ESCALATION.md OPENCODE.md tests/test_rc53_ceremony.py
          git commit -m 'RC53: generated ceremony-collapse tree'
          git push origin HEAD:rc53-ceremony-collapse
