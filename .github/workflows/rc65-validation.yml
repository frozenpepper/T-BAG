name: RC65 temporary validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Focused RC65 tests
        run: python -m unittest tests.test_rc45_parent_tick tests.test_workspace tests.test_components
      - name: Full unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py'
