name: RC52 broad validation

on:
  push:
    branches: [rc52-architecture]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc52-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile control plane
        run: python -m py_compile scripts/*.py
      - name: Run Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check diff hygiene
        run: git diff --check
