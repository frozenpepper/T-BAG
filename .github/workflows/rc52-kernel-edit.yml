name: RC52 obligation-first validation

on:
  push:
    branches: [rc52-architecture]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc52-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply obligation-first lifecycle ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('scripts/dsd_task.py')
          text=path.read_text(encoding='utf-8')
          old='''    # Terminal durable state dominates chronological attempt residue.\n    if status in {"integrated","superseded"}: return None\n    if status=="accepted":\n        return {**base,"action":"integrate-accepted-task"} if task.get("requires_integration") else None\n    if status=="blocked":\n        return {**base,"action":"await-human-decision","escalation":task.get("last_escalation")}\n\n'''
          new='''    # Explicit durable obligations outrank task terminality; task status then\n    # outranks chronological attempt residue. This is the actionability order.\n    findings=open_review_findings(task)\n    if any(not str(f.get("triage_task_id") or "") for f in findings):\n        return {**base,"action":"prepare-followup-triage","finding_count":len(findings)}\n    if status in {"integrated","superseded"}: return None\n    if status=="accepted":\n        return {**base,"action":"integrate-accepted-task"} if task.get("requires_integration") else None\n    if status=="blocked":\n        return {**base,"action":"await-human-decision","escalation":task.get("last_escalation")}\n\n'''
          assert text.count(old)==1
          text=text.replace(old,new,1)
          duplicate='''    findings=open_review_findings(task)\n    if any(not str(f.get("triage_task_id") or "") for f in findings):\n        return {**base,"action":"prepare-followup-triage","finding_count":len(findings)}\n'''
          # The old lower-priority obligation check must disappear: there is one owner/order.
          assert text.count(duplicate)==2
          first=text.find(duplicate)
          second=text.find(duplicate,first+1)
          text=text[:second]+text[second+len(duplicate):]
          path.write_text(text,encoding='utf-8')

          test=Path('tests/test_rc52_architecture.py')
          t=test.read_text(encoding='utf-8')
          needle='''        self.assertEqual(accepted["action"],"integrate-accepted-task")\n        recovery=dsd_task._reconcile_action(Path("/tmp/run"),"p",{\n'''
          insert='''        self.assertEqual(accepted["action"],"integrate-accepted-task")\n        integrated_with_obligation=dsd_task._reconcile_action(Path("/tmp/run"),"p",{\n            "task_id":"integrated-followup","status":"integrated","attempts":[residue],"requires_integration":True,\n            "review_history":[{"findings":[{"finding_id":"F1","status":"open","text":"carry me"}]}],\n        })\n        self.assertEqual(integrated_with_obligation["action"],"prepare-followup-triage")\n        recovery=dsd_task._reconcile_action(Path("/tmp/run"),"p",{\n'''
          assert t.count(needle)==1
          test.write_text(t.replace(needle,insert,1),encoding='utf-8')

          harness=Path('HARNESS.md')
          h=harness.read_text(encoding='utf-8')
          verbose='''`inspect`, `follow`, renderers and UI plugins observe or present state. They cannot gate, review, accept, integrate, replan or otherwise decide semantic outcomes.\n\nA `follow` observer is a disposable wake edge, not durable supervision. Once the role attempt deadline is exceeded it is not re-armed; the parent tick owns retirement/recovery from durable process and attempt evidence. Repeated same-session, non-zero, zero-delta launcher failures are likewise classified from terminal evidence and routed to Recovery by the control plane rather than escaped by cloning replacement tasks.\n'''
          compact='''`inspect`, `follow`, renderers and UI plugins only observe/present state. `follow` is disposable: after the role deadline it is not re-armed; the tick owns recovery, including repeated same-session zero-delta launcher failures.\n'''
          assert h.count(verbose)==1
          harness.write_text(h.replace(verbose,compact,1),encoding='utf-8')
          PY
      - name: Compile control plane
        run: python -m py_compile scripts/*.py
      - name: Run Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check diff hygiene
        run: git diff --check
      - name: Commit verified refinement
        shell: bash
        run: |
          git config user.name 'T-BAG RC52 verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/dsd_task.py tests/test_rc52_architecture.py HARNESS.md
          git commit -m 'RC52: order obligations before terminal task state'
          git push origin HEAD:rc52-architecture
