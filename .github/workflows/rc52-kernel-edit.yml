name: RC52 kernel edit

on:
  push:
    branches: [rc52-architecture]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc52-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate lifecycle invariants in the kernel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('scripts/dsd_task.py')
          text = path.read_text(encoding='utf-8')

          import_line = 'from _rules_snapshot import rules_revisions, verify_snapshot\n'
          assert text.count(import_line) == 1
          assert 'import scope_snapshot\n' not in text
          text = text.replace(import_line, import_line + 'import scope_snapshot\n', 1)

          start = text.index('def _reconcile_action(run: Path, phase: str, task: dict[str, Any]) -> dict[str, Any] | None:\n')
          end = text.index('\ndef _quiescent_reusable_review_conduit', start)
          reconcile_action = textwrap.dedent('''def _reconcile_action(run: Path, phase: str, task: dict[str, Any]) -> dict[str, Any] | None:
              """Return the one mechanically executable next action for a task.

              Durable task status owns actionability. Historical attempt residue may
              refine an unfinished lane, but it can never reopen a completed/superseded
              task or override a Recovery boundary.
              """
              tid=str(task.get("task_id") or ""); status=str(task.get("status") or ""); attempts=[a for a in task.get("attempts",[]) if isinstance(a,dict)]; latest=attempts[-1] if attempts else {}
              event=Path(str(latest.get("event_dir") or "")) if latest else Path()
              terminal=(event/"terminal.json").is_file() if event and str(event) not in {".",""} else False
              attempt_status=str(latest.get("status") or "")
              role=str(latest.get("role") or task.get("role") or "")
              base={"phase_id":phase,"task_id":tid,"task_status":status}

              # Terminal durable state dominates chronological attempt residue.
              if status in {"integrated","superseded"}: return None
              if status=="accepted":
                  return {**base,"action":"integrate-accepted-task"} if task.get("requires_integration") else None
              if status=="blocked":
                  return {**base,"action":"await-human-decision","escalation":task.get("last_escalation")}

              if latest and attempt_status=="gated" and report_requests_capability(event/"report.md"):
                  return {**base,"action":"route-capability-escalation","report":str(event/"report.md"),"role":role}
              if latest and attempt_status=="started" and terminal:
                  return {**base,"action":"gate-finished-attempt","event_dir":str(event)}
              if any(attempt_is_live(a) for a in attempts):
                  return None

              # Recovery is a durable lane decision (including poisoned-session
              # routing), so an older resumable session may not pull the task backward.
              if status=="recovery-required": return {**base,"action":"launch-recovery"}

              if attempt_status in {"report-recovery","report-resume","mutating-report-resume"}:
                  session=latest.get("session_id") or latest.get("resume_session")
                  return {**base,"action":"resume-recorded-session" if session else "retry-same-role-retained-workspace","role":role,"event_dir":str(event),**({"session_id":session} if session else {})}
              findings=open_review_findings(task)
              if any(not str(f.get("triage_task_id") or "") for f in findings):
                  return {**base,"action":"prepare-followup-triage","finding_count":len(findings)}
              if status=="needs-analysis": return {**base,"action":"launch-analyst-discovery"}
              if status=="needs-fix": return {**base,"action":"launch-fixer"}
              if status=="awaiting-review":
                  if latest and latest.get("role")=="reviewer" and latest.get("status")=="gated":
                      return {**base,"action":"record-review-outcome","report":str(event/"report.md")}
                  return {**base,"action":"launch-fresh-reviewer"}
              if status=="review-passed": return {**base,"action":"accept-reviewed-task"}
              if status in {"planned","ready"}:
                  ok,missing=readiness(run,phase,task)
                  if ok: return {**base,"action":"launch-ready-task","role":task.get("role"),"tier":task.get("tier")}
                  return {**base,"action":"waiting-dependencies","blocked_by":missing}
              if status=="active" and latest and latest.get("status")=="gated":
                  if role=="goal-planner": return {**base,"action":"launch-or-reuse-fresh-plan-reviewer","report":str(event/"report.md")}
                  if role=="plan-reviewer":
                      recorded=task.get("last_plan_review") if isinstance(task.get("last_plan_review"),dict) else {}
                      if str(recorded.get("reviewer_attempt") or "") == str(event): return None
                      return {**base,"action":"record-plan-review-outcome","report":str(event/"report.md")}
                  if role=="context-reviewer":
                      recorded=task.get("last_context_review") if isinstance(task.get("last_context_review"),dict) else {}
                      if str(recorded.get("reviewer_attempt") or "") == str(event): return None
                      return {**base,"action":"record-context-review-outcome","report":str(event/"report.md")}
                  if role=="phase-auditor":
                      return {**base,"action":"record-phase-gate","report":str(event/"report.md")}
                  if task.get("kind")=="verification" and role in BASE_ROLES_BY_KIND["verification"]:
                      return {**base,"action":"record-verification-result","report":str(event/"report.md")}
                  if role in ANALYST_DISPOSITION_ROLES:
                      declared=declared_report_outcome(event/"report.md",role,required=False)
                      if task.get("followup_triage_for") or task.get("kind") in {"implementation","verification"} or declared in {"resume","replan","replan-resume","escalate"}:
                          return {**base,"action":"record-analyst-disposition","report":str(event/"report.md")}
                  if task.get("kind") in {"analysis","verification"}: return {**base,"action":"accept-specialist-result","report":str(event/"report.md")}
              return None
          ''')
          text = text[:start] + reconcile_action + text[end:]

          reconcile_def = 'def command_reconcile_run(args: argparse.Namespace) -> dict[str, Any]:\n'
          assert text.count(reconcile_def) == 1
          housekeeping_helper = textwrap.dedent('''def _runtime_reaped_counts(housekeeping: dict[str, Any]) -> dict[str, int]:
              """Bound housekeeping receipts for the parent routing surface."""
              out: dict[str,int] = {}
              for key in ("cleaned","orphan_databases_removed","analysis_views_removed"):
                  value=housekeeping.get(key)
                  count=len(value) if isinstance(value,list) else int(value) if isinstance(value,int) else 0
                  if count: out[f"{key}_count"]=count
              return out


          ''')
          text = text.replace(reconcile_def, housekeeping_helper + reconcile_def, 1)

          exact_old = '    if housekeeping.get("cleaned") or housekeeping.get("orphan_databases_removed") or housekeeping.get("analysis_views_removed"):\n        result["runtime_reaped"]={k:v for k,v in housekeeping.items() if v and k!="skipped"}\n'
          assert text.count(exact_old) == 1
          exact_new = '    reaped_counts=_runtime_reaped_counts(housekeeping)\n    if reaped_counts: result["runtime_reaped"]=reaped_counts\n'
          text = text.replace(exact_old, exact_new, 1)

          old_changed = textwrap.dedent('''def _terminal_changed_count(terminal:dict[str,Any])->int|None:
              scope=terminal.get("scope_diff") if isinstance(terminal.get("scope_diff"),dict) else {}
              raw=scope.get("changed_count")
              try: return int(raw)
              except (TypeError,ValueError): return None
          ''')
          assert text.count(old_changed) == 1
          new_changed = textwrap.dedent('''def _terminal_changed_count(terminal:dict[str,Any], attempt:dict[str,Any]|None=None)->int|None:
              event_raw=str((attempt or {}).get("event_dir") or "")
              event=Path(event_raw) if event_raw else None
              return scope_snapshot.comparison_changed_count(terminal.get("scope_diff"),relative_to=event)
          ''')
          text = text.replace(old_changed, new_changed, 1)
          assert text.count('_terminal_changed_count(terminal)!=0') == 1
          text = text.replace('_terminal_changed_count(terminal)!=0', '_terminal_changed_count(terminal,attempt)!=0', 1)
          assert text.count('_terminal_changed_count(terminal)==0') == 1
          text = text.replace('_terminal_changed_count(terminal)==0', '_terminal_changed_count(terminal,attempt)==0', 1)

          path.write_text(text, encoding='utf-8')
          PY

          # Preserve the existing parent-facing reason token. The architecture changes
          # the deadline boundary, not the stable diagnostic vocabulary before it.
          sed -i 's/worker-cpu-still-changing-before-attempt-deadline/worker-cpu-still-changing/' scripts/parent_tick.py

          cat > tests/test_rc52_architecture.py <<'PY'
          import json
          import sys
          import tempfile
          import unittest
          from pathlib import Path
          from types import SimpleNamespace
          from unittest import mock

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPTS = ROOT / "scripts"
          sys.path.insert(0, str(SCRIPTS))

          import dsd_task
          import parent_tick
          import scope_snapshot


          class CanonicalScopeEvidenceTests(unittest.TestCase):
              def test_inline_and_path_scope_evidence_share_one_reader(self):
                  inline = {"changed_count": 0, "changed_since_attempt_baseline": []}
                  self.assertEqual(scope_snapshot.comparison_changed_count(inline), 0)
                  with tempfile.TemporaryDirectory() as td:
                      root = Path(td)
                      path = root / "scope-diff.json"
                      path.write_text(json.dumps(inline))
                      self.assertEqual(scope_snapshot.comparison_changed_count(str(path)), 0)
                      self.assertEqual(scope_snapshot.comparison_changed_count("scope-diff.json", relative_to=root), 0)

              def test_poison_candidate_accepts_terminal_scope_path(self):
                  with tempfile.TemporaryDirectory() as td:
                      root = Path(td)
                      attempts=[]
                      for index in range(3):
                          event=root/f"implementer-{index+1}"; event.mkdir()
                          scope=event/"scope-diff.json"; scope.write_text(json.dumps({"changed_count":0,"changed_since_attempt_baseline":[]}))
                          (event/"terminal.json").write_text(json.dumps({
                              "exit_code":1,"report_state":"launcher-placeholder","session_id":"ses-poison","scope_diff":str(scope)
                          }))
                          attempts.append({"role":"implementer","status":"report-resume","event_dir":str(event),"session_id":"ses-poison"})
                      candidate=dsd_task.poisoned_session_candidate({"role":"implementer","attempts":attempts})
                      self.assertIsNotNone(candidate)
                      self.assertEqual(candidate["session_id"],"ses-poison")


          class ActionabilityInvariantTests(unittest.TestCase):
              def test_durable_status_dominates_stale_attempt_residue(self):
                  residue={"role":"implementer","status":"report-resume","event_dir":"/nonexistent/attempt","session_id":"ses-old"}
                  self.assertIsNone(dsd_task._reconcile_action(Path("/tmp/run"),"p",{
                      "task_id":"old","status":"superseded","attempts":[residue],"requires_integration":True,
                  }))
                  accepted=dsd_task._reconcile_action(Path("/tmp/run"),"p",{
                      "task_id":"land","status":"accepted","attempts":[residue],"requires_integration":True,
                  })
                  self.assertEqual(accepted["action"],"integrate-accepted-task")
                  recovery=dsd_task._reconcile_action(Path("/tmp/run"),"p",{
                      "task_id":"recover","status":"recovery-required","attempts":[residue],"requires_integration":True,
                  })
                  self.assertEqual(recovery["action"],"launch-recovery")

              def test_housekeeping_default_receipt_is_counts_only(self):
                  self.assertEqual(
                      dsd_task._runtime_reaped_counts({"cleaned":[{"task_id":str(i)} for i in range(90)],"orphan_databases_removed":["x"]}),
                      {"cleaned_count":90,"orphan_databases_removed_count":1},
                  )


          class ParentEdgePolicyTests(unittest.TestCase):
              def test_acknowledged_stall_is_not_immediately_renotified(self):
                  state={"run_status":"active","backlog_count":1,"waiting_dependency_count":0,"live_attempts":[],"human_blocks":[],"first_useful_actions":[]}
                  monitors=[{"phase_id":"p","task_id":"t","attention":"silent-long-running"}]
                  first=parent_tick.update_due({},state,monitors,"workers-running",heartbeat_seconds=1800,changed_min_seconds=900)
                  self.assertTrue(first["due"])
                  loop={
                      "last_owner_update_at":parent_tick.now(),
                      "last_owner_update_signature":first["signature"],
                      "last_owner_update_reasons":first["reasons"],
                  }
                  second=parent_tick.update_due(loop,state,monitors,"workers-running",heartbeat_seconds=1800,changed_min_seconds=900)
                  self.assertFalse(second["due"])

              def test_compact_advance_drops_duplicate_quiescent_state(self):
                  self.assertIsNone(parent_tick.compact_advance({"applied":[],"stopped":"quiescent","state":{"runtime_reaped":{"cleaned_count":90}}}))

              def test_deadline_is_hard_boundary_for_silent_worker_and_observer(self):
                  event="/tmp/tbag-rc52-attempt"
                  state={
                      "run_id":"R","run_status":"active","worker_budget":{"max":1,"live":1,"free":0},
                      "backlog_count":1,"waiting_dependency_count":0,"first_useful_actions":[],"human_blocks":[],"unresolved_state":[],
                      "live_attempts":[{"phase_id":"p","task_id":"t","role":"implementer","event_dir":event}],
                  }
                  loop={"format":parent_tick.FORMAT,"stall_observations":{
                      event:{"first_seen_at":"2000-01-01T00:00:00+00:00","cpu_seconds_at_first_seen":1.0}
                  }}
                  observed={
                      "state":"running","attention":"silent-long-running","report_state":"launcher-placeholder",
                      "report_age_seconds":7200,"log_age_seconds":7200,
                      "deadline":{"exceeded":True,"limit_seconds":7200,"overrun_seconds":3600},
                      "process":{"worker":{"cpu_seconds":500.0}},
                  }
                  args=SimpleNamespace(
                      run_root=Path("/tmp/run"),phase_id=None,max_steps=12,report_complete_grace_seconds=30,
                      stall_confirm_seconds=300,owner_heartbeat_seconds=1800,changed_update_min_seconds=900,
                  )
                  with mock.patch.object(parent_tick,"load_loop",return_value=loop), \
                       mock.patch.object(parent_tick,"save_loop"), \
                       mock.patch.object(parent_tick.dsd_task,"load_run",return_value={"status":"active"}), \
                       mock.patch.object(parent_tick.dsd_task,"command_advance",return_value={"applied":[],"stopped":"quiescent","state":state}), \
                       mock.patch.object(parent_tick.dsd_task,"command_poison_scan",return_value={"count":0,"marked":[]}), \
                       mock.patch.object(parent_tick,"reconcile",return_value=state), \
                       mock.patch.object(parent_tick,"inspect_attempt",return_value=observed), \
                       mock.patch.object(parent_tick,"transport_registry",return_value={"adapter_pid":1,"observers":[]}), \
                       mock.patch.object(parent_tick,"observer_for",return_value=None), \
                       mock.patch.object(parent_tick,"retire_attempt",return_value={"retired":True}) as retire, \
                       mock.patch.object(parent_tick.dsd_task,"command_owner_status",return_value={}):
                      out=parent_tick.command_tick(args)
                  retire.assert_called_once()
                  self.assertNotIn("observer_rearm_required",out)
                  self.assertEqual(out["monitoring"][0]["observer_attention"],"observer-not-rearmed-after-attempt-deadline")


          if __name__ == "__main__":
              unittest.main()
          PY

          python -m py_compile scripts/dsd_task.py scripts/parent_tick.py scripts/scope_snapshot.py scripts/evidence_gate.py
          python -m unittest discover -s tests -p 'test_rc52_architecture.py'
          python -m unittest discover -s tests -p 'test_rc45_parent_tick.py'
          python -m unittest discover -s tests -p 'test_rc46_supervision.py'
          git diff --check
      - name: Commit verified kernel changes
        shell: bash
        run: |
          git config user.name 'T-BAG RC52 verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/dsd_task.py scripts/parent_tick.py tests/test_rc52_architecture.py
          if git diff --cached --quiet; then
            echo 'No kernel changes to commit.'
            exit 0
          fi
          git commit -m 'RC52: consolidate lifecycle kernel invariants'
          git push origin HEAD:rc52-architecture
